name: iOS Test Automation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Xcode
        uses: macos-setup@v1

      - name: Install dependencies
        run: |
          brew install cocoapods
          pod install

      - name: Run Tests
        run: |
          xcodebuild test -scheme RemindersApp -destination 'platform=iOS Simulator,name=iPhone 14' -resultBundlePath result.xcresult
          xcrun xcresulttool export --path result.xcresult --output ./test-results/junit.xml

      - name: Upload test results to GitHub Actions
        uses: actions/upload-artifact@v2
        with:
          name: test-results
          path: ./test-results/junit.xml
